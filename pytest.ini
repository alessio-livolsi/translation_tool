[pytest]
# Match test file patterns (ensure your tests are discovered properly)
python_files = test_*.py *_tests.py

# Ignore certain directories (recommended for performance & cleanliness)
norecursedirs = .* build dist *.egg-info node_modules templates venv

# Disable warnings (but still allows explicit ones if needed)
addopts = -p no:warnings -s --cov=script --cov-report=html

# Ensure invalid template variables cause test failures (if relevant)
FAIL_INVALID_TEMPLATE_VARS = True
